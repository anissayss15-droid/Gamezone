
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMEZONE - Inscription</title>
    <link rel="stylesheet" href="inscription.css">
</head>

<body>

    <header class="navbar">
        <h2>GAMEZONE</h2>

        <nav>
            <a href="../Acceuil/Open editors/accueil.html">ACCUEIL</a>
            <a href="../catalogue/catalogue.html">CATALOGUE</a>
            <a href="inscription.html">INSCRIPTION</a>
            <a href="../connexion/connexion.html">CONNEXION</a>
        </nav>
    </header>

    <div class="wrapper">

        <h1>Inscription</h1>

        <form id="formulaire">

            <div class="input-box">
                <input type="text" id="nom"
                       placeholder="Nom" required>
            </div>

            <div class="input-box">
                <input type="email" id="email"
                       placeholder="Adresse e-mail" required>
            </div>

            <div class="input-box">
                <input type="password" id="mdp"
                       placeholder="Mot de passe" required>
            </div>

            <div class="input-box">
                <input type="password" id="confirmation"
                       placeholder="Confirmer le mot de passe" required>
            </div>

            <button type="submit" class="btn">
                S'inscrire
            </button>

            <p id="message"></p>

            <div class="inscrire">
                <p>
                    Déjà un compte ?
                    <a href="../connexion/connexion.html">
                        Se connecter
                    </a>
                </p>
            </div>

        </form>

    </div>

    <script src="inscription.js"></script>

</body>
</html>
