
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMEZONE - Connexion</title>
    <link rel="stylesheet" href="connexion.css">
</head>

<body>

    <header class="navbar">
        <h2>GAMEZONE</h2>

        <nav>
            <a href="../Acceuil/Open editors/accueil.html">ACCUEIL</a>
            <a href="../catalogue/catalogue.html">CATALOGUE</a>
            <a href="../Inscription/inscription.html">INSCRIPTION</a>
            <a href="connexion.html">CONNEXION</a>
        </nav>
    </header>

    <div class="wrapper">

        <form id="formConnexion">

            <h1>Connexion</h1>

            <div class="input-box">
                <input type="text" id="nom"
                       placeholder="Nom" required>
            </div>

            <div class="input-box">
                <input type="password" id="mdp"
                       placeholder="Mot de passe" required>
            </div>

            <button type="submit" class="btn">
                Se connecter
            </button>

            <p id="message"></p>

            <div class="register-link">
                <p>
                    Pas encore de compte ?
                    <a href="../Inscription/inscription.html">
                        S'inscrire
                    </a>
                </p>
            </div>

        </form>

    </div>

    <script src="connexion.js"></script>

</body>
</html>
